baseURL = "https://go-fileshare.github.io/"
title = "go-fileshare"
disableKinds = ["taxonomy", "term", "RSS", "sitemap", "404"]

[markup.goldmark.renderer]
  unsafe = true

# Each repo card.
# "kind"  = which slice: server / protocol / identity.
# "type"  = lib (importable module) vs tool.
# "ci"    = true only where a GitHub Actions ci.yml actually exists, so the CI
#           badge never renders an empty "no status" -- honest badges only.
# "godoc" = true only where a module is PUBLISHED, so the card never links to a
#           pkg.go.dev 404; a repo without one links to itself. Same rule as ci.
# "cov"   = what CI enforces, not what was measured on somebody's laptop: an
#           exact 100% where the gate refuses anything less, and the recorded
#           floor otherwise. The standard is 100% everywhere; three repos do not
#           meet it yet and the badge says so rather than rounding up.
# "blurb" = drawn straight from each repo's README.

# --- the factors: is this person here, now? -----------------------------------
[[params.repos]]
  name = "fileshare"
  kind = "server"
  type = "tool"
  version = "v0.7.0"
  ci = true
  godoc = false
  cov = "≥70%"
  blurb = "One disk image over SMB, NFS, WebDAV, SFTP and **S3**: the same users, the same per-share access, one configuration file. A share that names who may use it is **not** exported over NFS, because `AUTH_UNIX` is a claim rather than a proof — unless a `kerberos` block gives NFS a ticket to check. Over S3 a share is a bucket, signed with SigV4."

# The five protocols this binary has. The list is not typed from memory: it is
# what `fileshare --protocol <nonsense>` enumerates when it refuses, which is
# the binary reading its own registry — "it has nfs, s3, sftp, smb and webdav".
# "proves" = what the protocol can actually check about a person, which is what
# decides who it can serve. Drawn from `fileshare check`'s own matrix.
[[params.protocols]]
  name = "smb"
  proves = "NTLMv2. Needs the password, or its `MD4(UTF16LE(password))` — an NT hash is enough, and is what a directory should hold if SMB is all it serves."

[[params.protocols]]
  name = "nfs"
  proves = "**Nothing, on its own.** `AUTH_UNIX` is a claim the client makes about itself and the wire cannot disagree with it — so a restricted share is not exported here at all, unless a `kerberos` block gives it `sec=krb5`."

[[params.protocols]]
  name = "webdav"
  proves = "HTTP Basic, or a bearer token an identity provider signed. The most forgiving of the five: a verifier the directory can only *check* is enough."

[[params.protocols]]
  name = "sftp"
  proves = "A public key or a certificate. Somebody with only `authorized_keys` reaches SFTP and none of the others — and somebody with only a password does not reach it."

[[params.protocols]]
  name = "s3"
  proves = "A SigV4 signature: an HMAC computed from the secret, which therefore has to be **the password itself** and not a hash of it. A share is a bucket."
